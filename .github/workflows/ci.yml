name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The Linux release is a static musl build: checked here, so a change
      # that breaks it fails the push rather than the release.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

  # NixOS installs the flake, not the tarball, so the flake is evaluated and
  # built on every change: a stale cargoLock or a nixpkgs change would
  # otherwise reach the first user who runs install.sh.
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --no-build --all-systems
      - run: nix build .#default --no-link

  # One release per version: a push to main whose Cargo.toml version has no
  # release yet builds the four targets and publishes `v<version>`, marked
  # latest, which is where install.sh downloads from. A push that keeps the
  # version publishes nothing, so a release never changes once it exists.
  version:
    needs: [test, flake]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl: a glibc build from these runners needs the runner's
          # own glibc, which most systems do not have.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled: GitHub retired the Intel macOS runner.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # aws-lc and ring compile C, and a musl target needs musl's compiler.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: strip target/${{ matrix.target }}/release/taggr-tui
      - name: Package
        run: |
          tar=taggr-tui-${{ matrix.target }}.tar.gz
          cp target/${{ matrix.target }}/release/taggr-tui taggr-tui
          tar -czf "$tar" taggr-tui
          if command -v sha256sum >/dev/null; then
            sha256sum "$tar" > "$tar.sha256"
          else
            shasum -a 256 "$tar" > "$tar.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: taggr-tui-${{ matrix.target }}
          path: taggr-tui-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  # One job creates the release with every binary in it, so a failed target
  # leaves no release at all rather than one missing a platform.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes of the same new version: the second waits, sees the release
    # the first made, and publishes nothing.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG was published by an earlier run"
            exit 0
          fi
          [ "$(ls dist/*.tar.gz | wc -l)" -eq 4 ] || { ls dist; echo "expected four targets" >&2; exit 1; }
          # What changed since the previous version: its commit subjects.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            { echo "Changes since $prev:"; echo; git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"; } > notes.md
          else
            echo "The first versioned release." > notes.md
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "taggr-tui ${TAG#v}" \
            --notes-file notes.md --latest
