[package]
name = "taggr-tui"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candid = "0.10.37"
chrono = "0.4.45"
diff-match-patch-rs = "0.5.1"
dirs = "7.0.0"
hex = "0.4.3"
ic-agent = "0.49.2"
image = "0.25"
notify-rust = "4.19.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
toml = "1.1.6"
