[package]
name = "taggr-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candid = "0.10.37"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0.0"
hex = "0.4.3"
ic-agent = "0.49.2"
image = "0.25"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
textwrap = "0.16.4"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
